<!DOCTYPE html>
<html lang="pt-BR">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>AquaOrca AI</title>
    <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
          .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
          h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
          .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
          .form-group { margin-bottom: 20px; }
          label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
          input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 6px; font-size: 14px; }
          button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
          button:hover { transform: scale(1.02); }
          .result { background: #f0f9ff; border: 2px solid #0ea5e9; border-radius: 8px; padding: 20px; margin-top: 20px; display: none; }
          .result.show { display: block; }
          .result h2 { color: #0369a1; margin-bottom: 15px; }
          .result-item { margin-bottom: 12px; }
          .result-label { color: #666; font-size: 14px; }
          .result-value { color: #333; font-weight: 600; }
          .total { background: white; padding: 15px; margin-top: 15px; text-align: center; border: 2px solid #0ea5e9; border-radius: 6px; }
          .total-value { color: #0ea5e9; font-size: 32px; font-weight: 700; }
        </style>
  </head>
  <body>
      <div class="container">
            <h1>AquaOrca AI</h1>
          <p class="subtitle">Orcamentos para manutencao de piscinas</p>p>
          
          <div class="form-group">
                <label>Numero da Piscina:</label>
                <input type="text" id="pool" placeholder="Ex: PSC-001">
          </div>div>
          
          <div class="form-group">
                <label>Tamanho (m2):</label>
                <input type="number" id="size" placeholder="Ex: 25" step="0.1">
          </div>div>
          
          <div class="form-group">
                <label>Complexidade:</label>
                <select id="complexity">
                        <option value="low">Baixa (Simples)</option>option>
                        <option value="medium">Media (Normal)</option>option>
                        <option value="high">Alta (Complexo)</option>option>
                </select>select>
          </div>div>
          
          <button onclick="calcular()">Calcular Orcamento</button>button>
          
          <div class="result" id="result">
                <h2>Resultado</h2>
                <div class="result-item"><div class="result-label">Piscina:</div>div><div class="result-value" id="rPool"></div>div></div>div>
                <div class="result-item"><div class="result-label">Tamanho:</div>div><div class="result-value" id="rSize"></div>div></div>div>
                <div class="result-item"><div class="result-label">Complexidade:</div>div><div class="result-value" id="rComplexity"></div>div></div>div>
                <div class="total"><div class="result-label">Valor Total:</div>div><div class="total-value" id="rTotal"></div>div></div>div>
          </div>div>
      </div>div>
    
    <script>
          function calcular() {
                  const pool = document.getElementById('pool').value;
                  const size = parseFloat(document.getElementById('size').value);
                  const complexity = document.getElementById('complexity').value;

                  if (!pool || !size) { alert('Preencha todos os campos!'); return; }

                  const base = size * 150;
                  const mult = { low: 1, medium: 1.3, high: 1.6 };
                  const total = Math.round(base * mult[complexity]);

                  document.getElementById('rPool').textContent = pool;
                  document.getElementById('rSize').textContent = size + ' m2';
                  document.getElementById('rComplexity').textContent = complexity;
                  document.getElementById('rTotal').textContent = 'R$ ' + (total / 100).toFixed(2).replace('.', ',');

                  document.getElementById('result').classList.add('show');
          }
    </script>
  </body>
</html>html>
    </script></label></label></h1>
  </body>
    </style></title>
  </head>
